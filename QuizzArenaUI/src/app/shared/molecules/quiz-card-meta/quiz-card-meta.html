<dl class="mt-1 flex flex-col gap-y-0.5 text-sm text-light-text-secondary dark:text-dark-text-secondary">
  @for (item of items(); track item.label) {
    <div class="flex min-w-0 items-center gap-1.5">
      <span class="flex h-4 w-4 shrink-0 items-center justify-center">
        @if (item.icon; as iconName) {
          <qz-icon [name]="iconName" class="h-4 w-4" />
        }
      </span>
      <dt class="shrink-0">{{ item.label }}:</dt>
      <dd class="min-w-0 truncate">
        @if (item.variant; as variant) {
          <qz-status-label [label]="item.value" [variant]="variant" />
        } @else {
          <span class="font-medium text-light-text dark:text-dark-text">{{ item.value }}</span>
        }
      </dd>
    </div>
  }
</dl>
