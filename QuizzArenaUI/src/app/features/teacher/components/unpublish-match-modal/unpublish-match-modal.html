<qz-item-container>
    Are you sure that you want to unpublish this match?
</qz-item-container>
<qz-item-container>
    {{ match().courseName }}
</qz-item-container>
<qz-item-container>
    <div class="flex justify-between gap-3 flex-wrap">
        <qz-button [fullWidth]="true" [variant]="'secondary'" (click)="handleCloseModalEvent()">
            Cancel
        </qz-button>
        <qz-button [fullWidth]="true" [variant]="'danger'" (click)="handleResetClick()">
            Unpublish
        </qz-button>
    </div>
</qz-item-container>
