<section class="mx-auto flex w-full max-w-5xl flex-col gap-5 pb-6">
  <header class="flex items-center gap-3">
    <qz-button size="small" variant="secondary" (click)="goBack()" [ariaLabel]="backAriaLabel">
      <qz-icon name="arrow-left" class="w-4 h-4" />
    </qz-button>
    <h1 i18n="Exam questions page heading" class="text-xl font-extrabold text-light-text dark:text-dark-text">
      {{ quiz()?.title }}
    </h1>
  </header>

  @if (noQuizData()) {
  <qz-item-container>
    <div class="flex flex-col items-center gap-4 py-12 text-center">
      <qz-icon name="quiz" class="h-12 w-12 text-light-text-secondary dark:text-dark-text-secondary opacity-40" />
      <p i18n="Exam questions missing data state"
        class="text-sm text-light-text-secondary dark:text-dark-text-secondary">
        Open this exam from the Exam Bank list to see its questions.
      </p>
    </div>
  </qz-item-container>
  } @else {
  <div class="flex flex-col gap-3">
    @for (question of questions(); track question.id) {
    <qz-admin-question-card [question]="question" [readOnly]="true" />
    } @empty {
    @if (!isLoadingQuestions()) {
    <qz-item-container>
      <div class="flex flex-col items-center gap-4 py-12 text-center">
        <qz-text-span [text]="'No questions found for this exam.'" />
      </div>
    </qz-item-container>
    }
    }
    @if (isLoadingQuestions()) {
    <div class="flex justify-center items-center py-4">
      <qz-text-span [text]="'Loading questions...'" />
    </div>
    }
  </div>
  }
</section>
